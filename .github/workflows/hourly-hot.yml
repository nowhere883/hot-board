# 每小时抓一次全网热榜，发布到 GitHub Pages。
# 改自 Jesseovo/last30days-skill-cn 的 daily-hot.yml，加了「我的分区」(zones.json)。
# 只抓各平台公开热榜，不用任何登录信息。
name: Hourly Hot Board

on:
  schedule:
    - cron: "7 * * * *" # 每小时第 7 分钟（避开整点，GitHub 整点排队多）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-hot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build hot board
        env:
          TZ: Asia/Shanghai
          LAST30DAYS_OUTPUT_DIR: ${{ runner.temp }}/hot-out
          LAST30DAYS_DISABLE_BROWSER: "1"
          LAST30DAYS_ZONES_FILE: ${{ github.workspace }}/zones.json
        run: |
          python scripts/last30days.py --hot --hot-sources boards,news --hot-limit 30 --emit html-path
          mkdir -p site
          cp "$LAST30DAYS_OUTPUT_DIR/hot.html" site/index.html
          cp "$LAST30DAYS_OUTPUT_DIR/hot.json" site/hot.json
          touch site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
